name: 'Deploy'
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [coral]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: 'Actuary-LLC/grafana'
          ref: 'main'

      - name: Deploy stack
        run: |
          # Remove existing stack to allow config updates
          # (Swarm configs are immutable — contents cannot be changed, only labels)
          if docker stack ls | grep -q grafana; then
            docker stack rm grafana
            echo "Waiting for stack cleanup..."
            sleep 10
          fi
          docker stack deploy -c grafana.yaml grafana
