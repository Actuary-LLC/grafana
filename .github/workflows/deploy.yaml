name: 'Deploy'
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: [coral]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: 'Actuary-LLC/grafana'
          ref: 'main'

      - name: Deploy stack
        run: docker stack deploy -c grafana.yaml grafana
