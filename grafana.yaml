version: "3.9"

networks:
  reverse-proxy:
    external: true

volumes:
  loki-data:
    driver: local
  loki-compactor:
    driver: local
  promtail-positions:
    driver: local

configs:
  loki-config:
    file: ./loki/config.yaml
  promtail-config:
    file: ./promtail/config.yaml

services:
  # ── Loki ──────────────────────────────────────────────────────────
  #   Internal only: http://loki:3100 (overlay network)
  #   No Traefik — not accessible externally
  loki:
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/config.yml
    configs:
      - source: loki-config
        target: /etc/loki/config.yml
    volumes:
      - /mnt/user/docker/volumes/grafana/loki:/loki
      - loki-compactor:/loki/compactor
    networks:
      reverse-proxy:
    deploy:
      placement:
        constraints:
          - node.role == manager
  # ── Promtail ─────────────────────────────────────────────────────
  #   Runs on every node, auto-discovers all swarm services
  promtail:
    image: grafana/promtail:3.1.0
    command: -config.file=/etc/promtail/config.yml
    configs:
      - source: promtail-config
        target: /etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-positions:/tmp
    networks:
      reverse-proxy:
    deploy:
      mode: global
